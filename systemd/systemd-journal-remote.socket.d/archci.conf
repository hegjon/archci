# Worker journals arrive through ssh tunnels (archci-logging-remote.service on
# each worker, ARCHCI_JOURNAL_URL=http://127.0.0.1:19532), so the port listens
# on loopback only. journal-remote can serve a single listener, so this
# replaces the stock wildcard one rather than adding to it.
[Socket]
ListenStream=
ListenStream=127.0.0.1:19532
