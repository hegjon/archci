# qemu-user-static-binfmt's registration of qemu-riscv64 with the C flag added:
# setuid binaries inside the emulated chroot (makepkg's sudo pacman) keep their
# privileges. Installed as /etc/binfmt.d/qemu-riscv64-static.conf, which
# systemd-binfmt prefers over the stock file of the same name in /usr/lib/binfmt.d.
:qemu-riscv64:M::\x7fELF\x02\x01\x01\x00\x00\x00\x00\x00\x00\x00\x00\x00\x02\x00\xf3\x00:\xff\xff\xff\xff\xff\xff\xff\x00\xff\xff\xff\xff\xff\xff\xff\xff\xfe\xff\xff\xff:/usr/bin/qemu-riscv64-static:FPC
