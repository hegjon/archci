#!/hint/bash
# shellcheck disable=2034
# archci: devtools' makepkg.conf.d/x86_64.conf.d/rust.conf for x86_64_v4, kept in step
# by hand; -C target-cpu=x86-64-v4 is the level, as -march is for C

#
# /etc/makepkg.conf.d/rust.conf
#

#########################################################################
# RUST LANGUAGE SUPPORT
#########################################################################

# Flags used for the Rust compiler, similar in spirit to CFLAGS. Read
# linkman:rustc[1] for more details on the available flags.
RUSTFLAGS="-C target-cpu=x86-64-v4 -C force-frame-pointers=yes -C link-arg=-Wl,--icf=safe"

# Usually this would include: ``-C debuginfo=2 -C strip=none''. Read
# linkman:rustc[1] for more details on the available flags.
DEBUG_RUSTFLAGS="-C debuginfo=2 -C strip=none"
