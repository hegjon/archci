# archci: the chroot pacman.conf for x86_64_v4 builds (archci-build takes it
# from /etc/archci/x86_64_v4/extra.conf, then here, then devtools'
# extra.conf). devtools' extra.conf with two changes. Architecture lists
# the level and x86_64: the chroot installs the farm's own x86_64_v4 builds
# (archci-build puts the farm's repository first, with $arch, which pacman
# expands to the first Architecture: x86_64_v4) and Arch's x86_64 packages
# for everything else. The mirrors have no x86_64_v4 directory, so the
# Arch repositories are spelled with os/x86_64 instead of the host's
# mirrorlist and its $arch.
[options]
CacheDir    = /var/cache/archci/pkg/x86_64_v4/
HoldPkg     = pacman glibc
Architecture = x86_64_v4 x86_64
NoProgressBar
VerbosePkgLists
ParallelDownloads = 5
DownloadUser = alpm
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Server = https://geo.mirror.pkgbuild.com/$repo/os/x86_64

[extra]
Server = https://geo.mirror.pkgbuild.com/$repo/os/x86_64
