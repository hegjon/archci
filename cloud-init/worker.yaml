#cloud-config
# Digital Ocean user-data for a build worker. Assumes an Arch Linux image with
# cloud-init (e.g. the official Arch cloud image uploaded as a custom image).
# Builds the archci packages from git and installs the worker one. Fill in the
# master's private IP in /etc/hosts and the shared worker key, then create
# droplets with:  doctl compute droplet create ... --user-data-file worker.yaml
# Workers are interchangeable: destroy one and its job is requeued by the master.
package_update: true
packages: [git, base-devel, btrfs-progs]

write_files:
  - path: /etc/archci/archci.conf
    permissions: '0644'
    content: |
      ARCHCI_MASTER="archci@master"
      ARCHCI_PKGBUILDS_URL=https://github.com/hegjon/omarchy-pkgs.git
  - path: /etc/archci/worker_key
    permissions: '0600'
    content: |
      -----BEGIN OPENSSH PRIVATE KEY-----
      ...paste the worker key authorized on the master with archci-authorize...
      -----END OPENSSH PRIVATE KEY-----
  - path: /etc/archci/builder-secret.asc
    permissions: '0600'
    content: |
      -----BEGIN PGP PRIVATE KEY BLOCK-----
      ...one shared builder key for the fleet; its public half is trusted once
      on the signer with archci-authorize-builder...
      -----END PGP PRIVATE KEY BLOCK-----
  - path: /etc/hosts
    append: true
    content: |
      10.0.0.2 master
  - path: /etc/pacman.d/mirrorlist
    permissions: '0644'
    content: |
      Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch

runcmd:
  # build the packages (makepkg refuses to run as root) and install the worker
  - useradd -m builder
  - sudo -u builder git clone https://github.com/hegjon/archci.git /home/builder/archci
  - sudo -u builder bash -c 'cd /home/builder/archci && makepkg -s --noconfirm'
  - pacman -U --noconfirm /home/builder/archci/archci-git-*.pkg.tar.zst /home/builder/archci/archci-worker-git-*.pkg.tar.zst
  # the shared fleet builder key, so every ephemeral worker signs with one key
  # the signer already trusts (archci-worker-setup would otherwise generate one)
  - install -d -m 700 /etc/archci/builder-gnupg
  - gpg --homedir /etc/archci/builder-gnupg --batch --import /etc/archci/builder-secret.asc
  # one worker per ~4 GB RAM and 2 vCPU is a reasonable start
  - systemctl enable --now archci-worker@1
