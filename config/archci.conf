# /etc/archci/archci.conf -- this host's archci settings, every role. Plain
# KEY=value, sourced by bash; environment variables override it.
#
# Every setting has a default (lib/archci-common.sh), so only what differs
# goes here. The annotated list of all of them, with their defaults:
#   /usr/share/doc/archci/archci.conf.example
# (config/archci.conf.example in the source tree). Typical entries:
#
#   ARCHCI_MASTER="archci@master"          worker: the master it claims from
#   ARCHCI_ARCHES="x86_64 aarch64"         master: the arches it builds
#   ARCHCI_R2_STAGING="r2:archci-staging"  master/signer: the R2 hand-off
#   ARCHCI_R2_RELEASE="r2:archci"
#   ARCHCI_RELEASE_URL="https://..."       master: the released repo's URL
