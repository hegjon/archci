# /etc/ssh/sshd_config.d/60-archci.conf -- worker keys for the archci master.
#
# Workers log in as the archci user with keys archci-authorize appends to
# /etc/archci/authorized_keys, each restricted to the job protocol by a forced
# command. The file is root's: the archci user (which the forced command and
# the queue scripts run as) must not be able to authorize keys for itself.
# A worker outside the private network streams its journal through an ssh
# tunnel to the journal-remote port (archci-logging-tunnel.service); that is
# the only forwarding the archci user may do. Keys are the only way in for
# it, whatever the rest of the configuration says about passwords.
Match User archci
    AuthorizedKeysFile /etc/archci/authorized_keys
    PasswordAuthentication no
    AllowTcpForwarding local
    PermitOpen 127.0.0.1:19533
    X11Forwarding no
    PermitTunnel no
