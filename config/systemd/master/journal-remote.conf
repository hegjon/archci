# /usr/lib/systemd/journal-remote.conf.d/archci.conf -- worker journals on
# the master (an /etc/systemd/journal-remote.conf.d/ file of yours overrides it)
[Remote]
Seal=false
# one set of files for every worker (/var/lib/archci/journal/archci-workers.journal):
# they all arrive through the ssh tunnel as 127.0.0.1, so a split by sender
# would not tell them apart; archci-top keys on the unit name in each entry
SplitMode=none
# Keep every build's log: no size or file-count cap. journald keeps writing
# until only KeepFree is left on the archci volume, then vacuums the oldest,
# so the journal grows to fill the volume but never hard-fills it (a full
# /var/lib/archci would break the queue, the pool and staging). Raise KeepFree
# if the other data on the volume needs more headroom. MaxFiles is set high so
# the ~128 MB-per-file rotation is bounded only by KeepFree, not by a count.
MaxUse=1000G
MaxFiles=100000
KeepFree=5G
