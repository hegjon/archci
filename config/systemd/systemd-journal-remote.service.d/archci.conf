# The master's receiver for the workers' journals: plain HTTP on
# 127.0.0.1:19533, bound by the service itself rather than handed in by the
# stock socket unit, so the one port number is written here like everywhere
# else (the workers' tunnels, sshd's PermitOpen, ARCHCI_JOURNAL_URL). Only
# the ssh tunnels reach it; the workers' ends are the same address and port.
[Unit]
Requires=
[Service]
# the stock unit's private network is for a socket handed in from outside
PrivateNetwork=no
ExecStart=
ExecStart=/usr/lib/systemd/systemd-journal-remote --listen-http=127.0.0.1:19533 --output=/var/log/journal/remote/archci-workers.journal
[Install]
Also=
WantedBy=multi-user.target
