# Upload only the archci journal namespace (the worker and build units log
# there via LogNamespace=archci), never the rest of the machine's journal.
# archci-worker-setup writes the URL drop-in from ARCHCI_JOURNAL_URL; without
# one (URL empty) the upload does not start.
# The upload goes through the tunnel of archci-logging-remote.service: it is
# part of that unit (restarts with it) and retries without limit, since a
# master reboot leaves the port closed for a minute and the stock unit gives
# up after five quick failures (start-limit-hit) and stays down.
[Unit]
ConditionPathExists=/run/systemd/journal-upload.conf.d/archci.conf
After=archci-worker-setup.service archci-logging-remote.service
PartOf=archci-logging-remote.service
StartLimitIntervalSec=0

[Service]
ExecStart=
ExecStart=/usr/lib/systemd/systemd-journal-upload --save-state --namespace=archci
Restart=always
RestartSec=10
