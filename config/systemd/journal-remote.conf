# /etc/systemd/journal-remote.conf.d/archci.conf -- worker journals on the master
[Remote]
Seal=false
# one set of files for every worker (/var/log/journal/remote/remote.journal):
# they all arrive through the ssh tunnel as 127.0.0.1, so a split by sender
# would not tell them apart; archci-top keys on the unit name in each entry
SplitMode=none
MaxUse=2G
MaxFiles=200
