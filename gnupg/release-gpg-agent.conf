# /etc/archci/release-gnupg/gpg-agent.conf -- the signer's release keyring.
# Cache the release passphrase for a day, so archci-sign's timer keeps signing
# after one "archci-sign --unlock"; allow-loopback-pinentry is what --unlock
# uses to pass it in. archci-sign-health warns when the cache has lapsed.
default-cache-ttl 86400
max-cache-ttl 86400
allow-loopback-pinentry
